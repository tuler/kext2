[package]
name = "kext2"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Build ext2 filesystem images from directories, tar archives and device tables, without root"
readme = "README.md"
keywords = ["ext2", "filesystem", "image", "mkfs"]
categories = ["filesystem", "command-line-utilities"]

[lib]
name = "kext2"
path = "src/lib.rs"

[[bin]]
name = "kext2"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
liblzma = { version = "0.4", features = ["static"] }
zstd = "0.13"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

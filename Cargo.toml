[workspace]
resolver = "2"
members = ["crates/kext2", "crates/kext2-node"]
default-members = ["crates/kext2"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tuler/kext2"
rust-version = "1.87"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[package]
name = "kext2-node"
description = "Node.js binding for kext2"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kext2 = { path = "../kext2" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
tempfile = "3"

[build-dependencies]
napi-build = "2"
